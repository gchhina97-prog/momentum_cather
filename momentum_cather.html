<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Momentum Catcher (Fixed)</title>
  <style>
    body { background: #0e1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 0; padding: 20px; }
    h1 { color: #58a6ff; }
    button { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 8px 16px; cursor: pointer; border-radius: 6px; margin-right: 8px; }
    button:hover { background: #30363d; }
    #log { background: #161b22; border: 1px solid #30363d; padding: 15px; height: 220px; overflow-y: auto; font-size: 13px; white-space: pre-wrap; margin: 20px 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #30363d; font-size: 13px; }
    th { color: #8b949e; }
    .pick { color: #3fb950; font-weight: bold; }
    .skip { color: #8b949e; }
    .positive { color: #3fb950; }
    .negative { color: #f85149; }
    .error { color: #f85149; }
    #status { margin-left: 10px; color: #8b949e; }
  </style>
</head>
<body>
  <h1>⚡ Momentum Catcher (Fixed)</h1>
  <div>
    <button id="scanBtn">Scan Now</button>
    <button id="autoBtn">Auto: OFF</button>
    <button id="downloadBtn">Download JSON</button>
    <span id="status">Idle</span>
  </div>
  <div id="log">Ready.</div>
  <table id="results">
    <thead>
      <tr>
        <th>Symbol</th><th>Price</th><th>24h%</th><th>Vol Accel</th>
        <th>RSI</th><th>Score</th><th>Signal</th><th>TP</th><th>SL</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    // Try direct first, then fall back to a CORS proxy
    const ENDPOINTS = [
      'https://fapi.binance.com',
      'https://corsproxy.io/?https://fapi.binance.com',
      'https://api.allorigins.win/raw?url=https://fapi.binance.com'
    ];
    const TOP_N = 40;
    let autoInterval = null;
    let workingEndpoint = null;

    const logEl = document.getElementById('log');
    const tbody = document.querySelector('#results tbody');
    const statusEl = document.getElementById('status');

    function log(msg, cls = '') {
      const time = new Date().toISOString().replace('T', ' ').slice(11, 19);
      const span = document.createElement('div');
      span.className = cls;
      span.textContent = `[${time}] ${msg}`;
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function tryFetch(path) {
      // If we already know a working endpoint, use it
      const order = workingEndpoint
        ? [workingEndpoint, ...ENDPOINTS.filter(e => e !== workingEndpoint)]
        : ENDPOINTS;

      let lastErr;
      for (const base of order) {
        const url = path.startsWith('http') ? path : `${base}${path}`;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          if (!workingEndpoint) {
            workingEndpoint = base;
            log(`✅ Using endpoint: ${base}`);
          }
          return data;
        } catch (e) {
          lastErr = e;
        }
      }
      throw lastErr || new Error('All endpoints failed');
    }

    function calcRSI(closes, period = 14) {
      if (closes.length < period + 1) return 50;
      let gains = 0, losses = 0;
      for (let i = closes.length - period; i < closes.length; i++) {
        const d = closes[i] - closes[i - 1];
        if (d > 0) gains += d; else losses -= d;
      }
      const ag = gains / period, al = losses / period;
      if (al === 0) return 100;
      return 100 - 100 / (1 + ag / al);
    }

    async function scan() {
      statusEl.textContent = 'Scanning...';
      log('Starting scan...');
      tbody.innerHTML = '';

      try {
        const tickers = await tryFetch('/fapi/v1/ticker/24hr');
        if (!Array.isArray(tickers)) throw new Error('Unexpected response format');

        const usdt = tickers.filter(t =>
          t.symbol.endsWith('USDT') &&
          !t.symbol.includes('UP') && !t.symbol.includes('DOWN') &&
          !['USDCUSDT','BUSDUSDT','FDUSDUSDT','TUSDUSDT'].includes(t.symbol)
        );
        usdt.sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume));
        const candidates = usdt.slice(0, TOP_N);
        log(`Found ${usdt.length} USDT pairs. Scanning top ${candidates.length}.`);

        const picks = [];
        let ok = 0, fail = 0;

        for (const t of candidates) {
          try {
            const k = await tryFetch(`/fapi/v1/klines?symbol=${t.symbol}&interval=1m&limit=30`);
            const closes = k.map(x => parseFloat(x[4]));
            const vols = k.map(x => parseFloat(x[5]));
            const price = closes[closes.length - 1];
            const avgV = vols.slice(0, -1).reduce((a, b) => a + b, 0) / (vols.length - 1);
            const curV = vols[vols.length - 1];
            const volAccel = avgV > 0 ? curV / avgV : 0;
            const change = ((price - closes[0]) / closes[0]) * 100;
            const rsi = calcRSI(closes);

            let score = volAccel * 20 + change * 2;
            if (rsi > 50) score += 10;
            if (rsi > 70) score -= 5;

            const signal = (volAccel > 1.5 && change > 0.5 && rsi > 40) ? 'PICK' : 'SKIP';
            const tp = price * 1.02, sl = price * 0.98;

            if (signal === 'PICK') {
              picks.push({ symbol: t.symbol, price, volAccel, rsi, score, tp, sl });
              log(`✅ PICK ${t.symbol} | VolAccel ${volAccel.toFixed(2)} | RSI ${rsi.toFixed(1)} | Score ${score.toFixed(1)}`);
            }

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${t.symbol}</td>
              <td>${price.toFixed(6)}</td>
              <td class="${parseFloat(t.priceChangePercent) >= 0 ? 'positive' : 'negative'}">${parseFloat(t.priceChangePercent).toFixed(2)}%</td>
              <td>${volAccel.toFixed(2)}</td>
              <td>${rsi.toFixed(1)}</td>
              <td>${score.toFixed(1)}</td>
              <td class="${signal === 'PICK' ? 'pick' : 'skip'}">${signal}</td>
              <td>${tp.toFixed(6)}</td>
              <td>${sl.toFixed(6)}</td>
            `;
            tbody.appendChild(tr);
            ok++;
            await new Promise(r => setTimeout(r, 60));
          } catch (e) {
            fail++;
            log(`⚠️ ${t.symbol}: ${e.message}`, 'error');
          }
        }

        localStorage.setItem('momentum_picks', JSON.stringify(picks, null, 2));
        log(`Scan complete. OK: ${ok}, Failed: ${fail}, Picks: ${picks.length}.`);
        statusEl.textContent = `Done (${picks.length} picks)`;
      } catch (e) {
        log(`❌ Fatal error: ${e.message}`, 'error');
        log('Tip: if you see "Failed to fetch", your browser or region may block Binance. Try a VPN, or use the Python version.', 'error');
        statusEl.textContent = 'Error';
      }
    }

    document.getElementById('scanBtn').onclick = scan;
    document.getElementById('autoBtn').onclick = (e) => {
      if (autoInterval) {
        clearInterval(autoInterval); autoInterval = null;
        e.target.textContent = 'Auto: OFF';
        log('Auto-scan stopped.');
      } else {
        autoInterval = setInterval(scan, 30000);
        e.target.textContent = 'Auto: ON';
        log('Auto-scan started (30s).');
        scan();
      }
    };
    document.getElementById('downloadBtn').onclick = () => {
      const data = localStorage.getItem('momentum_picks') || '[]';
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'momentum_picks.json';
      a.click();
    };
  </script>
</body>
</html>
